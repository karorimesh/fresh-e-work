error.handling.http-status-in-json-response=true
error.handling.exception-logging=NO_LOGGING
error.handling.full-stacktrace-http-statuses=5xx
error.handling.log-levels.5xx=ERROR
springdoc.pathsToMatch=/

freshservice.base-url=${FRESHSERVICE_BASE_URL:https://domain.freshservice.com}
freshservice.api-key=${FRESHSERVICE_API_KEY:}
freshservice.agent-id=${FRESHSERVICE_AGENT_ID:3}

github.base-url=${GITHUB_BASE_URL:https://api.github.com}
github.api-token=${GITHUB_API_TOKEN:}
github.api-version=${GITHUB_API_VERSION:2026-03-10}
github.owner=${GITHUB_OWNER:}
github.repo=${GITHUB_REPO:}

azure.ai.endpoint=${AZURE_AI_ENDPOINT:}
azure.ai.api-key=${AZURE_AI_API_KEY:}
azure.ai.deployment=${AZURE_AI_DEPLOYMENT:}
azure.ai.api-version=${AZURE_AI_API_VERSION:2024-02-01}

ticket-sync.cron=${TICKET_SYNC_CRON:0 */5 * * * *}

ambiguous.base-url=${AMBIGUOUS_BASE_URL:https://app.ambiguous.ai}
ambiguous.api-token=${AMBIGUOUS_API_TOKEN:}
ambiguous.assignee-id=${AMBIGUOUS_ASSIGNEE_ID:}
